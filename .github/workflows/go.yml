name: gopuca
on:
  push:
    branches:
      - main
      - opcua_interface-changes
  pull_request:

# Read-only: the jobs build and test, and publish nothing.
permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test go${{ matrix.go }}
    runs-on: ubuntu-latest
    # The server package's tests take a few minutes under the race detector.
    # The limit is there to end a hang, not to bound a normal run.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The oldest release go.mod allows, and a current one.
        go: ["1.23.x", "1.25.x"]

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
        id: go

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.X"
          architecture: "x64"

      - name: Get dependencies
        run: |
          go mod download
          make install-py-opcua

      - name: Unit tests
        run: make test

      - name: Integration tests against python-opcua
        run: make integration

      - name: Integration tests, client against server
        run: make selfintegration

  # An independent client implementation against the server, so that the two
  # sides of the protocol are not checked only against each other.
  interop:
    name: Interop (asyncua client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.X"

      - name: Run the asyncua interop check
        run: make interop
